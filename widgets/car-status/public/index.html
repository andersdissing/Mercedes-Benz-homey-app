<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Status</title>
<style>
  :root {
    --color-green: #4caf50;
    --color-red: #f44336;
    --color-orange: #ff9800;
    --color-blue: #2196f3;
    --color-fuel: #ff9800;
    --color-text-secondary: var(--homey-text-color-light, #888);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--homey-text-color, #333);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    min-height: 24px;
  }

  .model-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .energy-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .energy-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .energy-label {
    font-size: 11px;
    color: var(--color-text-secondary);
    width: 28px;
    flex-shrink: 0;
  }

  .energy-bar-bg {
    flex: 1;
    height: 14px;
    background: var(--homey-background-color-light, #eee);
    border-radius: 7px;
    overflow: hidden;
  }

  .energy-bar-fill {
    height: 100%;
    border-radius: 7px;
    transition: width 0.5s ease;
  }

  .energy-bar-fill.battery { background: var(--color-blue); }
  .energy-bar-fill.fuel { background: var(--color-fuel); }

  .energy-value {
    font-size: 11px;
    color: var(--color-text-secondary);
    width: 70px;
    text-align: right;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }

  .status-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }

  .status-text {
    font-size: 11px;
    color: var(--color-text-secondary);
  }

  .status-separator {
    font-size: 11px;
    color: var(--color-text-secondary);
    opacity: 0.4;
    margin: 0 2px;
  }

  .hidden { display: none !important; }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--color-text-secondary);
    font-size: 13px;
  }
</style>
</head>
<body class="homey-widget">
  <div id="loading" class="loading">Loading...</div>
  <div id="content" class="hidden">
    <div class="header">
      <div class="model-name" id="modelName"></div>
    </div>

    <div class="energy-section" id="energySection">
      <div class="energy-row" id="batteryRow">
        <span class="energy-label">EV</span>
        <div class="energy-bar-bg">
          <div class="energy-bar-fill battery" id="batteryBar" style="width:0%"></div>
        </div>
        <span class="energy-value" id="batteryValue">--%</span>
      </div>
      <div class="energy-row" id="fuelRow">
        <span class="energy-label">Fuel</span>
        <div class="energy-bar-bg">
          <div class="energy-bar-fill fuel" id="fuelBar" style="width:0%"></div>
        </div>
        <span class="energy-value" id="fuelValue">--</span>
      </div>
    </div>

    <div class="status-row" id="statusRow">
      <!-- Lock icon -->
      <svg id="lockIcon" class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g id="iconLocked">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </g>
        <g id="iconUnlocked" class="hidden">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </g>
      </svg>
      <span class="status-text" id="lockText">Locked</span>
      <span class="status-separator">|</span>
      <!-- Car window icon -->
      <svg id="openIcon" class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Car door frame -->
        <path d="M3 18V8l4-4h7l3 3v11"/>
        <!-- Window glass -->
        <path d="M5 12V8l3-3h5l2 2v5H5z"/>
        <!-- Door handle -->
        <line x1="8" y1="15" x2="12" y2="15"/>
      </svg>
      <span class="status-text" id="openText">All closed</span>
    </div>
  </div>

<script type="text/javascript">
  function isDoorOpen(status) {
    return status && (status === 'Open' || status === 'OPEN' || status === 'true' || status === true || status === '1');
  }

  function isWindowOpen(status) {
    if (!status) return false;
    if (status === 'Closed' || status === 'CLOSED' || status === '2') return false;
    return true;
  }

  function isSunroofOpen(status) {
    if (!status || status === 'Closed' || status === '0') return false;
    return true;
  }

  function update(data) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');

    document.getElementById('modelName').textContent = data.model || 'Mercedes-Benz';

    // Lock icon and text
    var locked = data.locked === true;
    document.getElementById('lockIcon').style.color = locked ? 'var(--color-green)' : 'var(--color-red)';
    document.getElementById('iconLocked').classList.toggle('hidden', !locked);
    document.getElementById('iconUnlocked').classList.toggle('hidden', locked);
    var lockText = document.getElementById('lockText');
    lockText.textContent = locked ? 'Locked' : 'Unlocked';
    lockText.style.color = locked ? 'var(--color-green)' : 'var(--color-red)';

    // Check doors/windows/sunroof open status
    var openItems = [];

    if (data.doors) {
      if (isDoorOpen(data.doors.frontLeft)) openItems.push('Door FL');
      if (isDoorOpen(data.doors.frontRight)) openItems.push('Door FR');
      if (isDoorOpen(data.doors.rearLeft)) openItems.push('Door RL');
      if (isDoorOpen(data.doors.rearRight)) openItems.push('Door RR');
      if (isDoorOpen(data.doors.trunk)) openItems.push('Trunk');
      if (isDoorOpen(data.doors.hood)) openItems.push('Hood');
    }

    if (data.windows) {
      if (isWindowOpen(data.windows.frontLeft)) openItems.push('Win FL');
      if (isWindowOpen(data.windows.frontRight)) openItems.push('Win FR');
      if (isWindowOpen(data.windows.rearLeft)) openItems.push('Win RL');
      if (isWindowOpen(data.windows.rearRight)) openItems.push('Win RR');
    }

    if (isSunroofOpen(data.sunroof)) openItems.push('Sunroof');

    var openIcon = document.getElementById('openIcon');
    var openText = document.getElementById('openText');

    if (openItems.length > 0) {
      openIcon.style.color = 'var(--color-red)';
      openText.style.color = 'var(--color-red)';
      openText.textContent = openItems.join(', ');
    } else {
      openIcon.style.color = 'var(--color-green)';
      openText.style.color = 'var(--color-green)';
      openText.textContent = 'All closed';
    }

    // Energy bars
    var hasBattery = data.battery != null && data.battery > 0;
    var hasFuel = data.fuel != null && data.fuel > 0;
    var hasRangeElectric = data.rangeElectric != null && data.rangeElectric > 0;
    var hasRangeLiquid = data.rangeLiquid != null && data.rangeLiquid > 0;

    var batteryRow = document.getElementById('batteryRow');
    if (hasBattery || hasRangeElectric) {
      batteryRow.classList.remove('hidden');
      var pct = data.battery || 0;
      document.getElementById('batteryBar').style.width = pct + '%';
      var batteryText = pct + '%';
      if (hasRangeElectric) batteryText += ' \u00B7 ' + Math.round(data.rangeElectric) + ' km';
      document.getElementById('batteryValue').textContent = batteryText;
    } else {
      batteryRow.classList.add('hidden');
    }

    var fuelRow = document.getElementById('fuelRow');
    if (hasFuel || hasRangeLiquid) {
      fuelRow.classList.remove('hidden');
      var fuelPct = data.fuel || 0;
      document.getElementById('fuelBar').style.width = fuelPct + '%';
      var fuelText = fuelPct + '%';
      if (hasRangeLiquid) fuelText += ' \u00B7 ' + Math.round(data.rangeLiquid) + ' km';
      document.getElementById('fuelValue').textContent = fuelText;
    } else {
      fuelRow.classList.add('hidden');
    }

    if (!hasBattery && !hasFuel && !hasRangeElectric && !hasRangeLiquid) {
      batteryRow.classList.remove('hidden');
      document.getElementById('batteryBar').style.width = '0%';
      document.getElementById('batteryValue').textContent = '--';
      fuelRow.classList.add('hidden');
    }
  }

  async function fetchData() {
    try {
      var data = await Homey.api('GET', '/', {});
      if (data) update(data);
      return data;
    } catch(error) {
      console.error('Failed to fetch data:', error);
      document.getElementById('loading').textContent = 'Error: ' + (error.message || String(error));
      return null;
    }
  }

  async function onHomeyReady(Homey) {
    await Homey.ready({ height: 160 });
    var data = await fetchData();
    var interval = (data && data.pollingInterval) || 180000;
    setInterval(fetchData, interval);
  }
</script>
</body>
</html>
