<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Status</title>
<style>
  :root {
    --color-green: #4caf50;
    --color-red: #f44336;
    --color-orange: #ff9800;
    --color-blue: #2196f3;
    --color-fuel: #ff9800;
    --color-text-secondary: var(--homey-text-color-light);
    --tile-bg: rgba(128, 128, 128, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    min-height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--homey-text-color);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--homey-background-color);
  }

.model-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.3px;
    margin-bottom: 8px;
    color: var(--homey-text-color);
}

  /* The headline doubles as the link to the device card once the app has
     told us where that lives; the chevron is the only visual hint. */
  .model-name.linked {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .model-name .model-name-chevron {
    display: none;
    margin-left: 4px;
    color: var(--color-text-secondary);
    font-weight: 400;
  }

  .model-name.linked .model-name-chevron { display: inline; }

  .energy-section {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 12px;
  }

  .energy-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .energy-label {
    font-size: 11px;
    color: var(--color-text-secondary);
    width: 28px;
    flex-shrink: 0;
  }

  .energy-bar-bg {
    flex: 1;
    height: 12px;
    background: var(--tile-bg);
    border-radius: 6px;
    overflow: hidden;
  }

  .energy-bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.5s ease;
  }

  .energy-bar-fill.battery { background: var(--color-blue); }
  .energy-bar-fill.fuel { background: var(--color-fuel); }

  .energy-bar-fill.battery {
    position: relative;
    overflow: hidden;
  }

  .energy-bar-fill.battery::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      100deg,
      transparent 0%,
      transparent 8%,
      rgba(255, 255, 255, 0.65) 11%,
      transparent 15%,
      transparent 100%
    );
    background-size: 240% 100%;
    background-position: 0% 0;
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .energy-bar-fill.battery.charging::after {
    opacity: 1;
    animation: chase 4.4s linear infinite;
  }

  @keyframes chase {
    from { background-position: 0% 0; }
    to   { background-position: -240% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .energy-bar-fill.battery.charging::after {
      animation: none;
      opacity: 0.55;
      background-position: -60% 0;
    }
  }

  .energy-value {
    font-size: 11px;
    color: var(--color-text-secondary);
    width: 70px;
    text-align: right;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .tiles-row {
    display: flex;
    gap: 8px;
  }

  .tile {
    flex: 1;
    height: 52px;
    background: var(--tile-bg);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }

  .tile svg {
    width: 22px;
    height: 22px;
  }

  .tile-label {
    font-size: 9px;
    font-weight: 500;
    opacity: 0.8;
  }

  .hidden { display: none !important; }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--color-text-secondary);
    font-size: 13px;
  }

  .not-configured {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 8px;
    padding: 16px;
    text-align: center;
  }

  .not-configured svg {
    opacity: 0.5;
  }

  .not-configured p {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.4;
  }

</style>
</head>
<body class="homey-widget">
  <div id="loading" class="loading">Loading...</div>
  <div id="notConfigured" class="not-configured hidden">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p>Edit the widget and select a car to display.</p>
  </div>
  <div id="content" class="hidden">
<div class="model-name homey-text-bold homey-font-size-default" id="modelName" role="link" tabindex="0"><span id="modelNameText">Mercedes-Benz</span><span class="model-name-chevron" aria-hidden="true">›</span></div>

    <div class="energy-section" id="energySection">
      <div class="energy-row" id="batteryRow">
        <span class="energy-label">EV</span>
        <div class="energy-bar-bg">
          <div class="energy-bar-fill battery" id="batteryBar" style="width:0%"></div>
        </div>
        <span class="energy-value" id="batteryValue">--%</span>
      </div>
      <div class="energy-row" id="fuelRow">
        <span class="energy-label">Fuel</span>
        <div class="energy-bar-bg">
          <div class="energy-bar-fill fuel" id="fuelBar" style="width:0%"></div>
        </div>
        <span class="energy-value" id="fuelValue">--</span>
      </div>
    </div>

    <div class="tiles-row">
      <!-- Lock tile -->
      <div class="tile" id="tileLock">
        <svg id="tileLockIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <g id="tileIconLocked">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </g>
          <g id="tileIconUnlocked" class="hidden">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
          </g>
        </svg>
        <span class="tile-label" id="tileLockLabel">Locked</span>
      </div>

      <!-- Doors tile -->
      <div class="tile" id="tileDoors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18V8l4-4h7l3 3v11"/>
          <path d="M5 12V8l3-3h5l2 2v5H5z"/>
          <line x1="8" y1="15" x2="12" y2="15"/>
        </svg>
        <span class="tile-label" id="tileDoorsLabel">Closed</span>
      </div>

      <!-- Climate tile -->
      <div class="tile" id="tileClimate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 8a4 4 0 0 0 0 8" fill="currentColor" opacity="0.3"/>
        </svg>
        <span class="tile-label" id="tileClimateLabel">Off</span>
      </div>
    </div>
  </div>

<script type="text/javascript">
  function isDoorOpen(status) {
    return status && (status === 'Open' || status === 'OPEN' || status === 'true' || status === true || status === '1');
  }

  function isWindowOpen(status) {
    if (!status) return false;
    if (status === 'Closed' || status === 'CLOSED' || status === '2') return false;
    return true;
  }

  function isSunroofOpen(status) {
    if (!status || status === 'Closed' || status === '0') return false;
    return true;
  }

  function setTileColor(tileEl, color) {
    tileEl.style.color = color;
  }

  function update(data) {
    document.getElementById('loading').classList.add('hidden');
    // The not-configured panel is full height, so leaving it visible would
    // cover the content we are about to render. It must be hidden here or a
    // single transient not-configured response latches the widget forever.
    document.getElementById('notConfigured').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');

    document.getElementById('modelNameText').textContent = data.model || 'Mercedes-Benz';

    // Headline -> device card. The device id is the one the user picked for
    // this widget (a Homey device UUID); the app supplies the Homey id.
    deviceUrl = (data.homeyId && selectedDeviceId)
      ? 'https://my.homey.app/homeys/' + encodeURIComponent(data.homeyId) + '/devices/' + encodeURIComponent(selectedDeviceId)
      : null;
    document.getElementById('modelName').classList.toggle('linked', deviceUrl !== null);

    // Lock tile
    var locked = data.locked === true;
    var lockColor = locked ? 'var(--color-green)' : 'var(--color-red)';
    setTileColor(document.getElementById('tileLock'), lockColor);
    document.getElementById('tileIconLocked').classList.toggle('hidden', !locked);
    document.getElementById('tileIconUnlocked').classList.toggle('hidden', locked);
    document.getElementById('tileLockLabel').textContent = locked ? 'Locked' : 'Unlocked';

    // Doors/Windows tile
    var openItems = [];
    if (data.doors) {
      if (isDoorOpen(data.doors.frontLeft)) openItems.push('FL');
      if (isDoorOpen(data.doors.frontRight)) openItems.push('FR');
      if (isDoorOpen(data.doors.rearLeft)) openItems.push('RL');
      if (isDoorOpen(data.doors.rearRight)) openItems.push('RR');
      if (isDoorOpen(data.doors.trunk)) openItems.push('Trunk');
      if (isDoorOpen(data.doors.hood)) openItems.push('Hood');
    }
    if (data.windows) {
      if (isWindowOpen(data.windows.frontLeft)) openItems.push('W-FL');
      if (isWindowOpen(data.windows.frontRight)) openItems.push('W-FR');
      if (isWindowOpen(data.windows.rearLeft)) openItems.push('W-RL');
      if (isWindowOpen(data.windows.rearRight)) openItems.push('W-RR');
    }
    if (isSunroofOpen(data.sunroof)) openItems.push('Roof');

    var doorsOk = openItems.length === 0;
    var doorsColor = doorsOk ? 'var(--color-green)' : 'var(--color-red)';
    setTileColor(document.getElementById('tileDoors'), doorsColor);
    document.getElementById('tileDoorsLabel').textContent = doorsOk ? 'Closed' : openItems.length + ' open';

    // Climate tile
    var climateOn = data.climateOn === true;
    var climateColor = climateOn ? 'var(--color-green)' : '#fff';
    setTileColor(document.getElementById('tileClimate'), climateColor);
    document.getElementById('tileClimateLabel').textContent = climateOn ? 'On' : 'Off';

    // Energy bars
    var hasBattery = data.battery != null && data.battery > 0;
    var hasFuel = data.fuel != null && data.fuel > 0;
    var hasRangeElectric = data.rangeElectric != null && data.rangeElectric > 0;
    var hasRangeLiquid = data.rangeLiquid != null && data.rangeLiquid > 0;

    var batteryRow = document.getElementById('batteryRow');
    if (hasBattery || hasRangeElectric) {
      batteryRow.classList.remove('hidden');
      var pct = data.battery || 0;
      document.getElementById('batteryBar').style.width = pct + '%';
      document.getElementById('batteryBar').classList.toggle('charging', data.charging === true);
      var batteryText = pct + '%';
      if (hasRangeElectric) batteryText += ' \u00B7 ' + Math.round(data.rangeElectric) + ' km';
      document.getElementById('batteryValue').textContent = batteryText;
    } else {
      batteryRow.classList.add('hidden');
    }

    var fuelRow = document.getElementById('fuelRow');
    if (hasFuel || hasRangeLiquid) {
      fuelRow.classList.remove('hidden');
      var fuelPct = data.fuel || 0;
      document.getElementById('fuelBar').style.width = fuelPct + '%';
      var fuelText = fuelPct + '%';
      if (hasRangeLiquid) fuelText += ' \u00B7 ' + Math.round(data.rangeLiquid) + ' km';
      document.getElementById('fuelValue').textContent = fuelText;
    } else {
      fuelRow.classList.add('hidden');
    }

    if (!hasBattery && !hasFuel && !hasRangeElectric && !hasRangeLiquid) {
      batteryRow.classList.remove('hidden');
      document.getElementById('batteryBar').style.width = '0%';
      document.getElementById('batteryValue').textContent = '--';
      fuelRow.classList.add('hidden');
    }
  }

  var selectedDeviceId = null;
  var _homey = null;
  var deviceUrl = null;

  // Homey.popup() is the widget API's only way out of the widget frame: the
  // web app opens the URL in a popup window, the mobile app in an in-app
  // browser view. hapticFeedback() must be called inside the touch handler.
  function openDeviceCard() {
    if (!deviceUrl || !_homey) return;
    try { _homey.hapticFeedback(); } catch (e) { /* not on every platform */ }
    Promise.resolve(_homey.popup(deviceUrl)).catch(function (error) {
      console.error('Failed to open the device card:', error);
    });
  }

  // The widget endpoint only reads already-cached capability values from
  // Homey - it never calls the Mercedes API - so it is deliberately NOT tied
  // to the device's `polling_interval` setting. That setting rate-limits
  // backend calls and can be up to an hour, which would leave the dashboard
  // an hour stale even while the app receives real-time WebSocket pushes.
  var REFRESH_INTERVAL = 15000; // 15 seconds

  var hasRenderedData = false;

  async function fetchData() {
    try {
      var path = selectedDeviceId ? '/status/' + encodeURIComponent(selectedDeviceId) : '/';
      var data = await _homey.api('GET', path, {});
      if (data && data.error === 'not_configured') {
        // Only show the placeholder if we have never had data. Once real data
        // has been rendered, a transient not-configured response (app restart,
        // driver not ready yet) should leave the last known values on screen
        // rather than blanking the widget.
        if (!hasRenderedData) {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('content').classList.add('hidden');
          document.getElementById('notConfigured').classList.remove('hidden');
        }
        return null;
      }
      if (data) {
        update(data);
        hasRenderedData = true;
      }
      return data;
    } catch(error) {
      console.error('Failed to fetch data:', error);
      // Don't wipe good data on a transient failure - only surface the error
      // while the widget is still on its initial loading state.
      if (!hasRenderedData) {
        document.getElementById('loading').textContent = 'Error: ' + (error.message || String(error));
      }
      return null;
    }
  }

  async function startWidget() {
    await fetchData();
    setInterval(fetchData, REFRESH_INTERVAL);
  }

  async function onHomeyReady(Homey) {
    _homey = Homey;
    await Homey.ready({ height: 160 });

    var headline = document.getElementById('modelName');
    headline.addEventListener('click', openDeviceCard);
    headline.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openDeviceCard();
      }
    });

    var deviceIds = Homey.getDeviceIds();
    if (deviceIds && deviceIds.length > 0) {
      selectedDeviceId = deviceIds[0];
    }

    startWidget();
  }
</script>
</body>
</html>
